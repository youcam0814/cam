<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟终端演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas,monospace}
body{
  background:#000;color:#0f0;padding:16px;font-size:15px;line-height:1.7;
}
.gray{color:#aaa}
input{background:#111;border:1px solid #333;color:#0f0;padding:6px;outline:none;width:240px;font-size:15px}
#log{white-space:pre-wrap;margin-bottom:10px;height:220px;overflow:auto}
.cursor{display:inline-block;width:8px;height:16px;background:#0f0;animation:blink 0.7s infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
#page2{display:none;margin-bottom:30px;}
#dataList{margin:10px 0;}
/* 全屏数据流盒子 */
#streamOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#000;
  z-index:99;
  padding:15px;
  overflow:auto;
  white-space:pre-wrap;
  display:none;
}
#streamBtn{background:#222;color:#0f0;border:1px solid #0f0;padding:6px 12px;cursor:pointer;margin-bottom:10px;}
</style>
</head>
<body>
<div>
<!-- 【改动】把数据列表移到最上方 -->
<div id="page2">
<div>===== 数据列表 =====</div>
<br>
<div id="dataList"></div>
<br>
<div class="gray">⚠二改狗老牧师</div>
</div>

<div id="log"></div>
<div>
<label>账号：</label>
<input id="user">
</div>
<br>
<button onclick="startRun()" style="background:#222;color:#0f0;border:1px solid #0f0;padding:6px 12px;cursor:pointer">确认提交</button>
<span class="cursor"></span>
<br><br>
<button id="streamBtn" onclick="startStream()">读取账号数据</button>

<div class="gray" style="margin-top:20px;line-height:1.8">
户籍猎手｜照妖镜｜验证码<br>
入侵电脑设备｜盗取 QQ 号｜网络攻｜击｜全家大头照 <br>
作者：娜娜子姊姊  利威尔
</div>

<pre class="gray" style="margin-top:20px;">
      .--""--.
    .'        `.
   /            \
  |              |
   \            /
    `.         .'
      `-.  .-'
       |    |
       |    |
       |    |
       |    |
     (   )（   ）
</pre>
</div>

<!-- 全屏狂飙覆盖层 -->
<div id="streamOverlay"></div>

<script>
const logDom = document.getElementById('log');
const page2 = document.getElementById('page2');
const dataList = document.getElementById('dataList');
const streamOverlay = document.getElementById('streamOverlay');

function addLine(txt){
  logDom.innerHTML += txt + "\n";
  logDom.scrollTop = logDom.scrollHeight;
}
function sleep(t){return new Promise(r=>setTimeout(r,t))}

// 随机密码池
const pwdPool = [
  "Ls259614",
  "Qw694721",
  "Zx369258",
  "As147258",
  "Po258369",
  "Kj741852",
  "Uy159357"
];

// 生成随机英数串
function randStr(){
  const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
  let s = "";
  for(let i=0;i<16;i++){
    s += chars[Math.floor(Math.random()*chars.length)];
  }
  return s;
}

let streamTimer = null;
// 开启全屏数据流
async function startStream(){
  if(streamTimer) return;
  streamOverlay.style.display = "block";
  streamOverlay.innerText = "";
  let count = 0;
  const maxLine = 90;
  streamTimer = setInterval(()=>{
    // 一行4组随机串，横向铺满屏幕
    const line = randStr() + "    " + randStr() + "    " + randStr() + "    " + randStr();
    streamOverlay.innerText += line+"\n";
    streamOverlay.scrollTop = streamOverlay.scrollHeight;
    count++;
    if(count >= maxLine){
      clearInterval(streamTimer);
      streamTimer = null;
      streamOverlay.innerText += "\n==== 读取成功 ====\n";
      streamOverlay.innerText += "A7F2-9D4E-6C1B-805X\n";
      streamOverlay.scrollTop = streamOverlay.scrollHeight;
    }
  },60);
}

async function startRun(){
  const userInput = document.getElementById('user').value.trim();
  if(!userInput){
    addLine("⚠️ 请填写账号");
    return;
  }
  logDom.innerHTML = "";

  addLine(`输入账号：${userInput}`);
  addLine("正在校验身份信息...");
  await sleep(700);
  addLine("✅ 身份校验通过");
  await sleep(900);
  addLine("正在建立模拟测试会话");
  await sleep(800);
  addLine("✅ 模拟会话搭建完成");
  await sleep(600);
  addLine("正在同步本地测试数据");
  await sleep(700);
  addLine("✅ 本地数据同步完成");
  addLine("--------------------------");
  addLine("上传账号");

  await sleep(1200);
  const randomPwd = pwdPool[Math.floor(Math.random() * pwdPool.length)];
  dataList.innerHTML = `账号：${userInput}｜密码：${randomPwd}`;
  page2.style.display = "block";
}
</script>
